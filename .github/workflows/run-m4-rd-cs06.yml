name: Run M4 RelationshipDefinition CS-06 updater

on:
  push:
    branches:
      - M4
    paths:
      - .github/workflows/run-m4-rd-cs06.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: M4
          fetch-depth: 0

      - name: Normalize and execute the pending updater
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/apply-m4-rd-cs06.yml')
          text = source.read_text(encoding='utf-8')
          marker = '        run: |\n'
          if marker not in text:
              raise SystemExit('pending updater run block not found')

          body = text.split(marker, 1)[1]
          normalized = []
          for line in body.splitlines():
              normalized.append(line[10:] if line.startswith('          ') else line)

          script = '\n'.join(normalized) + '\n'
          script = script.replace(
              'git rm -- .github/workflows/apply-m4-rd-cs06.yml',
              'git rm -- .github/workflows/apply-m4-rd-cs06.yml .github/workflows/run-m4-rd-cs06.yml',
              1,
          )
          Path('/tmp/apply-m4-rd-cs06.sh').write_text(script, encoding='utf-8')
          PY

          bash /tmp/apply-m4-rd-cs06.sh
