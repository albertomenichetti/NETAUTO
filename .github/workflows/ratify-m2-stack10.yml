name: Ratify M2 STACK-10 technology

on:
  push:
    branches: [M2]
    paths:
      - .github/workflows/ratify-m2-stack10.yml

permissions:
  contents: write

jobs:
  ratify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Consolidate STACK-10 and propagate owner status
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}: {old[:80]!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          tech = "docs/general/technology_baseline.md"
          replace_once(
              tech,
              "**Status:** CURRENT / EXTENSIBLE — `STACK-01` through `STACK-09` are RATIFIED. Future technology decisions are non-authoritative until explicitly ratified and consolidated here.",
              "**Status:** CURRENT / EXTENSIBLE — `STACK-01` through `STACK-10` are RATIFIED. Future technology decisions are non-authoritative until explicitly ratified and consolidated here.",
          )

          old_stack09 = '''#### Custom NETAUTO CLI

          The current baseline has no custom operator CLI merely wrapping existing tools:

          ```text
          serve               -> Uvicorn
          schema migrations   -> Alembic
          tests               -> pytest
          project commands    -> uv
          ```

          `Typer` is not part of the current dependency baseline. A future real operator CLI requires a concrete NETAUTO-specific command surface and remains an adapter over application capabilities.'''
          new_stack09 = '''#### Server, administration and official client entrypoints

          Server and administrative entrypoints remain direct and explicit:

          ```text
          serve               -> Uvicorn
          schema migrations   -> Alembic
          tests               -> pytest
          project commands    -> uv
          ```

          The official `netauto` command selected in `STACK-10` is a genuine NETAUTO HTTP client. It does not wrap or replace Uvicorn, Alembic, pytest or uv, and it is not an alternate application-service or persistence interface.'''
          replace_once(tech, old_stack09, new_stack09)

          stack10 = '''### STACK-10 — official HTTP CLI and terminal interaction

          **Status:** RATIFIED.

          #### Capability boundary

          NETAUTO provides one official operator/client CLI with:

          ```text
          interactive asynchronous REPL
          non-interactive single-command mode
          public HTTP-only execution
          complete same-release business API coverage
          ```

          The CLI is not a wrapper for Uvicorn, Alembic, pytest or uv and is not an alternate application-service, Unit-of-Work or database interface.

          #### HTTP client

          ```text
          HTTPX AsyncClient
          ```

          is the canonical CLI HTTP transport.

          Required use:

          ```text
          one scoped client per connected endpoint/session or non-interactive command
          native asyncio
          HTTP connection pooling
          verified HTTPS and hostname validation
          explicit finite timeouts
          redirect following disabled
          no automatic retry
          ```

          HTTPX remains a client/infrastructure dependency. Its request and response types do not cross into the CLI command/result model or the server application/domain layers.

          The compatible project range is:

          ```text
          httpx>=0.28,<1
          ```

          Exact resolution is committed through `uv.lock` and, for installed-release synchronization, through the runtime lock owned by the active runtime/deployment architecture.

          #### Interactive terminal

          ```text
          prompt_toolkit 3.x
          ```

          is the canonical REPL terminal toolkit.

          Required use includes:

          ```text
          PromptSession
          prompt_async()
          line editing
          in-memory history integration
          Ctrl-R reverse search
          Ctrl-D and Ctrl-C key behavior
          terminal clear support
          ```

          `prompt_toolkit` owns terminal mechanics only. It does not own NETAUTO grammar, command registration, dispatch, connection state, HTTP behavior, output semantics or error classification.

          The compatible project range is:

          ```text
          prompt-toolkit>=3.0,<4
          ```

          with exact resolution through the committed dependency authorities.

          #### Process and parsing baseline

          The remaining CLI substrate uses standard-library mechanisms:

          ```text
          argparse
              -> process mode and `-n` invocation

          shlex in POSIX mode
              -> interactive command tokenization

          json
              -> structured inline/file values and machine output

          pathlib
              -> explicit file-backed JSON input

          asyncio
              -> process coroutine and async terminal/HTTP integration
          ```

          No general CLI framework is selected.

          #### Static command authority

          The official CLI command surface is described by one static same-release registry owned by the active CLI architecture.

          ```text
          registry
              -> parser
              -> help
              -> selector traversal
              -> HTTP dispatch
              -> response validation
              -> formatted rendering
              -> coverage verification
          ```

          Generated OpenAPI remains a transport description and is not a runtime command-generation authority.

          #### Explicitly not selected

          ```text
          Typer
          Click
          cmd2
          Rich as a semantic/output authority
          stdlib readline as the cross-platform REPL foundation
          dynamic OpenAPI command generation
          CLI plugin framework
          an alternative HTTP client
          ```

          Terminal styling may not become semantic output authority.

          #### Dependency and packaging consequences

          The runtime project dependencies include HTTPX and `prompt_toolkit`, and the distribution exposes the `netauto` console entrypoint.

          ```text
          pyproject compatibility ranges
              -> reviewed dependency intent

          uv.lock
              -> canonical exact repository resolution

          installed-release runtime lock
              -> exact target synchronization

          one NETAUTO wheel
              -> CLI modules and console entrypoint
          ```

          A CLI-only installation executes no server, database or Alembic initialization merely by importing or invoking the client.

          #### Testing consequences

          The ratified testing baseline is extended through:

          ```text
          pure CLI parser/state/registry tests
          HTTPX transport and ASGI integration tests where appropriate
          Linux PTY/process tests for Ctrl-R, Ctrl-D and Ctrl-C
          installed console-entrypoint and same-release coverage verification
          ```

          Fake HTTP or terminal evidence cannot be used to claim PostgreSQL, migration or server-runtime guarantees.

          #### Security consequences

          The realization must preserve:

          ```text
          HTTPS verification enabled
          no insecure verification bypass
          no native credential storage
          no URL userinfo
          no persistent cookie jar
          no hidden retry
          no persistent command history in M2
          ```

          Administered standard proxy and trust-store configuration may be consumed by HTTPX; it does not create a NETAUTO profile, identity or authorization authority.

          #### Relationship with STACK-09

          `STACK-09` remains the authority for Uvicorn serving and explicit Alembic administration. `STACK-10` adds a genuine public-HTTP client and does not create a wrapper command for server or migration operation.
          '''

          marker = "\n## 4. Evolution rule\n"
          text = Path(tech).read_text(encoding="utf-8")
          if text.count(marker) != 1:
              raise SystemExit("technology baseline: evolution marker is not unique")
          Path(tech).write_text(text.replace(marker, "\n" + stack10 + marker, 1), encoding="utf-8")

          cli = "docs/milestones/M2/architecture/cli.md"
          replace_once(
              cli,
              "**Status:** DRAFT — CLI DESIGN COMPLETE — API/HEALTH/VERIFICATION CROSS-CHECK PASSED — RUNTIME/TECHNOLOGY-BASELINE REVIEW PENDING",
              "**Status:** DRAFT — CLI DESIGN COMPLETE — API/HEALTH/RUNTIME/VERIFICATION/STACK-10 CROSS-CHECK PASSED — FINAL CLOSURE PENDING",
          )
          replace_once(
              cli,
              "API/Health/verification cross-check                 PASS\ntechnology selection                                CLOSED; STACK-10 consolidation pending",
              "API/Health/runtime/verification/STACK-10 cross-check PASS\ntechnology selection and project-wide authority      CLOSED",
          )
          replace_once(
              cli,
              '''This document remains `NOT FROZEN` until:

          - `runtime-deployment.md` confirms final wheel, dependency and CLI-only installation realization;
          - `docs/general/technology_baseline.md` consolidates the selected `STACK-10` decision;
          - the API and Health owners record final reciprocal CLI cross-check;
          - the complete architecture traceability/consistency closure passes.''',
              '''This document remains `NOT FROZEN` until:

          - final owner-by-owner traceability confirms every M2-OUT/M2-AC/M2-VER path;
          - the complete M2 architecture set passes contract, AS-IS, authority, terminology and normative-hygiene consistency closure.''',
          )

          runtime = "docs/milestones/M2/architecture/runtime-deployment.md"
          replace_once(
              runtime,
              "**Status:** DRAFT — RUNTIME/DEPLOYMENT DESIGN COMPLETE — CROSS-OWNER REVIEW PASSED — TECHNOLOGY-BASELINE/FINAL-CLOSURE PENDING",
              "**Status:** DRAFT — RUNTIME/DEPLOYMENT DESIGN COMPLETE — CROSS-OWNER/STACK-10 REVIEW PASSED — FINAL CLOSURE PENDING",
          )
          replace_once(
              runtime,
              "HTTPX/prompt-toolkit runtime dependencies after STACK-10 ratification",
              "HTTPX/prompt-toolkit runtime dependencies under ratified STACK-10",
          )
          replace_once(
              runtime,
              '''### 23.6 Technology-baseline handoff

          `STACK-10` must be ratified before architecture freeze. That consolidation authorizes the HTTPX/prompt-toolkit runtime dependencies already accounted for by the wheel and lock design.

          No other technology decision is required by this owner.''',
              '''### 23.6 Technology-baseline handoff

          `STACK-10` is ratified in `docs/general/technology_baseline.md`. It authorizes the HTTPX/prompt-toolkit runtime dependencies already accounted for by the wheel and exact-lock design.

          No other technology decision is required by this owner.''',
          )
          replace_once(
              runtime,
              "AS-IS/persistence/Health/CLI/verification cross-check  PASS",
              "AS-IS/persistence/Health/CLI/verification/STACK-10 review PASS",
          )
          replace_once(
              runtime,
              '''This document remains `NOT FROZEN` until:

          - `STACK-10` is formally ratified and consolidated in the technology baseline;
          - final owner-by-owner traceability confirms every M2-OUT/M2-AC/M2-VER path;
          - the complete M2 architecture set passes contract, AS-IS, authority and normative-hygiene consistency closure.''',
              '''This document remains `NOT FROZEN` until:

          - final owner-by-owner traceability confirms every M2-OUT/M2-AC/M2-VER path;
          - the complete M2 architecture set passes contract, AS-IS, authority, terminology and normative-hygiene consistency closure.''',
          )

          verification = "docs/milestones/M2/architecture/verification.md"
          replace_once(
              verification,
              "**Status:** DRAFT — VERIFICATION DESIGN COMPLETE — DEPENDENT-OWNER REVIEW / IMPLEMENTATION EVIDENCE PENDING",
              "**Status:** DRAFT — VERIFICATION DESIGN COMPLETE — HEALTH/CLI/RUNTIME HOOK REVIEW PASSED — FINAL CLOSURE / IMPLEMENTATION EVIDENCE PENDING",
          )
          replace_once(
              verification,
              "governance circularity                       CLOSED",
              "governance circularity                       CLOSED\ndependent-owner implementation-hook review          CLOSED",
          )
          replace_once(
              verification,
              '''This document remains `NOT FROZEN` until:

          - `health.md`, `cli.md` and `runtime-deployment.md` confirm the exact implementation-facing evidence hooks without changing these bundles;
          - every M2 architecture owner confirms its outcomes and acceptance criteria are correctly represented;
          - the complete architecture set passes contract, AS-IS and cross-document consistency closure.''',
              '''This document remains `NOT FROZEN` until:

          - every M2 architecture owner confirms its outcomes and acceptance criteria are correctly represented;
          - the complete architecture set passes contract, AS-IS, authority, terminology and normative-hygiene consistency closure.''',
          )

          proposal = "docs/milestones/M2/wip/cli-stack-10-proposal.md"
          replace_once(
              proposal,
              "**Status:** RATIFICATION PROPOSAL — CONSOLIDATION REQUIRED BEFORE M2 ARCHITECTURE FREEZE",
              "**Status:** RATIFIED / CONSOLIDATED — SUPERSEDED BY `docs/general/technology_baseline.md`",
          )
          replace_once(
              proposal,
              "**Authority:** TECHNOLOGY REVIEW INPUT — NON-NORMATIVE UNTIL CONSOLIDATED",
              "**Authority:** RATIFICATION RECORD — NON-NORMATIVE; PROJECT-WIDE AUTHORITY IS `STACK-10` IN THE TECHNOLOGY BASELINE",
          )
          replace_once(
              proposal,
              '''The decision becomes authoritative only after explicit consolidation in:

          ```text
          docs/general/technology_baseline.md
          ```

          as a ratified `STACK-10` entry.

          No dependency or implementation change is authorized by this proposal alone.''',
              '''The decision has been explicitly consolidated in:

          ```text
          docs/general/technology_baseline.md
          ```

          as the ratified `STACK-10` entry. This file remains historical review evidence and no longer carries an open ratification action.

          Dependency and implementation changes remain governed by the frozen M2 architecture set and future `steps.md`.''',
          )
          replace_once(proposal, "## Proposed STACK-10 — official HTTP CLI and terminal interaction", "## Ratified STACK-10 record — official HTTP CLI and terminal interaction")
          replace_once(proposal, "**Proposed status:** RATIFIED.", "**Ratification result:** RATIFIED and consolidated.")
          replace_once(
              proposal,
              '''[ ] explicitly approve this technology choice
          [ ] consolidate the decision as STACK-10 in technology_baseline.md
          [ ] update the baseline status range to include STACK-10
          [ ] update STACK-09's custom-CLI paragraph to reference STACK-10
          [ ] ensure runtime-deployment.md owns wheel/dependency consequences
          [ ] remove this item from architecture open points''',
              '''[x] explicitly approve this technology choice
          [x] consolidate the decision as STACK-10 in technology_baseline.md
          [x] update the baseline status range to include STACK-10
          [x] update STACK-09's client-entrypoint paragraph to reference STACK-10
          [x] ensure runtime-deployment.md owns wheel/dependency consequences
          [x] remove this item from architecture open points''',
          )
          with Path(proposal).open("a", encoding="utf-8") as stream:
              stream.write('''

          ## Consolidation outcome

          ```text
          decision                    RATIFIED
          project-wide authority      docs/general/technology_baseline.md / STACK-10
          CLI architecture alignment  PASS
          runtime packaging alignment PASS
          verification alignment      PASS
          contract reopening          NOT REQUIRED
          open technology point       0
          ```
          ''')

          readme = "docs/milestones/M2/architecture/README.md"
          replace_once(
              readme,
              "**Architecture set status:** DESIGN COMPLETE — FINAL CONSISTENCY / TECHNOLOGY RATIFICATION PENDING — NOT FROZEN",
              "**Architecture set status:** DESIGN COMPLETE — FINAL TRACEABILITY / CONSISTENCY CLOSURE PENDING — NOT FROZEN",
          )
          replace_once(
              readme,
              "| Official NETAUTO CLI | `cli.md` | DRAFT — DESIGN COMPLETE; API/HEALTH/RUNTIME/VERIFICATION REVIEW PASSED; STACK-10 RATIFICATION PENDING |",
              "| Official NETAUTO CLI | `cli.md` | DRAFT — DESIGN COMPLETE; API/HEALTH/RUNTIME/VERIFICATION/STACK-10 REVIEW PASSED; FINAL CLOSURE PENDING |",
          )
          replace_once(
              readme,
              "| Runtime configuration, packaging, startup guard, deployment and trust/TLS boundaries | `runtime-deployment.md` | DRAFT — DESIGN COMPLETE; CROSS-OWNER REVIEW PASSED; STACK-10/FINAL CLOSURE PENDING |",
              "| Runtime configuration, packaging, startup guard, deployment and trust/TLS boundaries | `runtime-deployment.md` | DRAFT — DESIGN COMPLETE; CROSS-OWNER/STACK-10 REVIEW PASSED; FINAL CLOSURE PENDING |",
          )
          replace_once(
              readme,
              "| Verification, acceptance evidence and traceability | `verification.md` | DRAFT — DESIGN COMPLETE; DEPENDENT-OWNER REVIEW PASSED; FINAL TRACEABILITY CLOSURE PENDING |",
              "| Verification, acceptance evidence and traceability | `verification.md` | DRAFT — DESIGN COMPLETE; HEALTH/CLI/RUNTIME HOOK REVIEW PASSED; FINAL TRACEABILITY CLOSURE PENDING |",
          )
          replace_once(
              readme,
              "    -> trusted-boundary HTTP and external TLS responsibility\n\nverification.md",
              "    -> trusted-boundary HTTP and external TLS responsibility\n\nSTACK-10\n    -> HTTPX AsyncClient as the official client transport\n    -> prompt_toolkit as the asynchronous REPL terminal foundation\n    -> stdlib process/token/JSON/file parsing\n    -> no general CLI framework or dynamic OpenAPI command generation\n\nverification.md",
          )
          replace_once(
              readme,
              '''1. formally ratify and consolidate the official CLI technology decision from `../wip/cli-stack-10-proposal.md` as `STACK-10` in `docs/general/technology_baseline.md`;
          2. perform the final owner-by-owner `M2-OUT -> M2-AC -> M2-VER -> implementation-path` traceability sweep;
          3. perform the final frozen-contract, AS-IS, cross-document authority, terminology and normative-hygiene consistency sweep;
          4. resolve every resulting finding without changing the frozen contract;
          5. mark every owner and this complete architecture set `FINAL / FROZEN` in one dedicated freeze transition.''',
              '''1. perform the final owner-by-owner `M2-OUT -> M2-AC -> M2-VER -> implementation-path` traceability sweep;
          2. perform the final frozen-contract, AS-IS, cross-document authority, terminology and normative-hygiene consistency sweep;
          3. resolve every resulting finding without changing the frozen contract;
          4. mark every owner and this complete architecture set `FINAL / FROZEN` in one dedicated freeze transition.''',
          )

          status = "docs/milestones/M2/status.md"
          replace_once(status, "**Milestone status:** DESIGN IN PROGRESS", "**Milestone status:** ARCHITECTURE DESIGN — FINAL CLOSURE")
          replace_once(
              status,
              "current task    build and freeze the normative M2 architecture set",
              "current task    execute final architecture traceability and consistency closure",
          )
          replace_once(
              status,
              "| Architecture set | DESIGN IN PROGRESS — NOT FROZEN |",
              "| Architecture set | DESIGN COMPLETE — FINAL CLOSURE IN PROGRESS — NOT FROZEN |",
          )
          replace_once(
              status,
              "No contract-level blocker remains. The architecture set must now propagate the frozen contract into explicit normative owners, close all semantic and technical design points, and pass its own consistency sweep before implementation planning can begin.",
              "No contract-level or architecture-design blocker remains. Every semantic, technical and project-wide technology owner is complete; only the final traceability and consistency closure remains before the architecture freeze transition.",
          )
          replace_once(
              status,
              "Create and complete the normative M2 architecture corpus registered in `architecture/README.md`, including Relationship domain/API/persistence, semantic concurrency and PostgreSQL realization, Health and startup guard, CLI, runtime/deployment, and verification/traceability ownership.",
              "Execute the final owner-by-owner traceability sweep and the frozen-contract, AS-IS, authority, terminology and normative-hygiene consistency sweep defined by `architecture/README.md`; resolve any finding before proposing the dedicated architecture freeze transition.",
          )

          cross_check = Path("docs/milestones/M2/wip/stack-10-ratification-cross-check.md")
          cross_check.write_text('''# M2 STACK-10 Ratification Cross-Check

          **Status:** PASS — STACK-10 RATIFIED AND PROPAGATED — FINAL ARCHITECTURE CLOSURE PENDING

          **Authority:** REVIEW EVIDENCE — NON-NORMATIVE

          ## Review target

          ```text
          docs/general/technology_baseline.md
              STACK-10 — official HTTP CLI and terminal interaction
          ```

          The review compares the ratified technology decision with:

          ```text
          docs/milestones/M2/contract.md
          docs/milestones/M2/architecture/api.md
          docs/milestones/M2/architecture/health.md
          docs/milestones/M2/architecture/cli.md
          docs/milestones/M2/architecture/runtime-deployment.md
          docs/milestones/M2/architecture/verification.md
          docs/milestones/M2/wip/cli-stack-10-proposal.md
          docs/general/technology_baseline.md STACK-01, STACK-03, STACK-05,
              STACK-07, STACK-08 and STACK-09
          ```

          ## Ratified decision

          ```text
          HTTP client
              HTTPX AsyncClient
              httpx>=0.28,<1

          terminal / REPL
              prompt_toolkit 3.x
              prompt-toolkit>=3.0,<4

          process and parsing
              argparse
              shlex POSIX mode
              json
              pathlib
              asyncio
          ```

          Explicitly not selected:

          ```text
          Typer
          Click
          cmd2
          Rich as semantic/output authority
          stdlib readline as the cross-platform REPL foundation
          dynamic OpenAPI command generation
          CLI plugin framework
          alternative HTTP client
          ```

          ## Closure summary

          ```text
          native-asyncio alignment                       PASS
          public HTTP-only client boundary               PASS
          static 63-operation registry compatibility     PASS
          Health /connect and /status compatibility      PASS
          verified HTTPS / no-insecure policy            PASS
          one-wheel and exact-lock packaging alignment   PASS
          CLI-only import/runtime independence            PASS
          PTY/HTTP/package verification hooks             PASS
          STACK-09 serving/admin boundary                PASS
          technology authority duplication               NONE
          open technology decision                       0
          contract reopening                              NOT REQUIRED
          ```

          ## Authority result

          `docs/general/technology_baseline.md` is now the sole project-wide technology authority for HTTPX and `prompt_toolkit`. `cli.md` owns command/client behavior, `runtime-deployment.md` owns dependency and wheel realization, and `verification.md` owns evidence. The historical proposal remains review evidence only.

          ## Remaining gate

          STACK-10 ratification closes the final project-wide technology decision required by M2. The architecture set now requires only:

          ```text
          final M2-OUT -> M2-AC -> M2-VER -> implementation-path traceability
          final contract / AS-IS / authority / terminology / hygiene sweep
          resolution of any resulting finding
          dedicated architecture freeze transition
          ```
          ''', encoding="utf-8")
          PY

      - name: Commit ratification
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            docs/general/technology_baseline.md \
            docs/milestones/M2/architecture/README.md \
            docs/milestones/M2/architecture/cli.md \
            docs/milestones/M2/architecture/runtime-deployment.md \
            docs/milestones/M2/architecture/verification.md \
            docs/milestones/M2/status.md \
            docs/milestones/M2/wip/cli-stack-10-proposal.md \
            docs/milestones/M2/wip/stack-10-ratification-cross-check.md
          git diff --cached --check
          git commit -m 'docs(m2): ratify STACK-10 official HTTP CLI'
          git push origin HEAD:M2
