    -> technical extraction additions assigned to persistence.md

'''
              if readme.count(completed_marker) != 1:
                  raise SystemExit('README completed-design marker not unique')
              readme = readme.replace(completed_marker, provenance_block + completed_marker, 1)

          if '## WIP extraction and retirement closure' not in readme:
              closure_marker = '## Final closure result\n'
              section = '''## WIP extraction and retirement closure

The complete source-to-authority map is owned by `provenance.md`; the review record is `../wip/wip-extraction-closure.md`.

```text
WIP census                              PASS — 19 / 19
primary discovery/decision sources       PASS — 8 / 8
