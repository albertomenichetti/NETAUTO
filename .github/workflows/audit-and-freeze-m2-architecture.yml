            docs/milestones/M2/wip/wip-extraction-closure.md
          git diff --cached --check
          git commit -m 'docs(m2): close WIP extraction into architecture'
          git push origin HEAD:M2

      - name: Freeze the complete architecture set
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          ROOT = Path('.')
          M2 = ROOT / 'docs/milestones/M2'
          ARCH = M2 / 'architecture'
          STEPS = M2 / 'steps.md'
          steps_before = STEPS.read_bytes()

          owners = [
              'relationship.md',
              'api.md',
              'persistence.md',
              'concurrency-matrix.md',
              'concurrency.md',
              'health.md',
              'cli.md',
              'runtime-deployment.md',
              'verification.md',
              'provenance.md',
          ]
          for name in owners:
              path = ARCH / name
              text = path.read_text(encoding='utf-8')
              text, count = re.subn(
                  r'^\*\*Status:\*\* .+$',
                  '**Status:** FINAL / FROZEN',
                  text,
                  count=1,
                  flags=re.MULTILINE,
              )
              if count != 1:
                  raise SystemExit(f'{name}: status line not replaced')
              text = text.replace(
                  '**Authority:** NORMATIVE M2 ARCHITECTURE DRAFT',
                  '**Authority:** NORMATIVE M2 ARCHITECTURE — FINAL / FROZEN',
                  1,
              )
              text = re.sub(
                  r'This document remains `NOT FROZEN` only until the dedicated architecture-set freeze transition is explicitly approved and committed\.',
                  'This document is `FINAL / FROZEN`. Any semantic or technical change requires formal architecture reopening and a renewed cross-document consistency review.',
                  text,
              )
              if name == 'provenance.md':
                  text = text.replace(
                      'This document freezes together with the complete architecture set.',
                      'This document is frozen together with the complete architecture set.',
                      1,
                  )
              path.write_text(text, encoding='utf-8')

          readme = ARCH / 'README.md'
          text = readme.read_text(encoding='utf-8')
          text, count = re.subn(
              r'^\*\*Architecture set status:\*\* .+$',
              '**Architecture set status:** FINAL / FROZEN',
              text,
              count=1,
              flags=re.MULTILINE,
          )
          if count != 1:
              raise SystemExit('README architecture status not replaced')
          text = text.replace(
              '''architecture set
    design owners complete
    traceability and consistency closure PASS
    READY FOR FREEZE REVIEW
    NOT FROZEN''',
              '''architecture set
    FINAL / FROZEN
    traceability, consistency and WIP-extraction closure PASS''',
              1,
          )
          table_replacements = {
              '| Architecture set control, coverage and freeze | `README.md` | CLOSURE PASSED — READY FOR FREEZE REVIEW |': '| Architecture set control, coverage and freeze | `README.md` | FINAL / FROZEN |',
              '| WIP extraction, provenance and retirement | `provenance.md` | DRAFT — EXTRACTION AUDIT PASSED; READY FOR FREEZE REVIEW |': '| WIP extraction, provenance and retirement | `provenance.md` | FINAL / FROZEN |',
              '| Relationship domain, version lifecycle and factual semantics | `relationship.md` | DRAFT — CLOSURE PASSED; READY FOR FREEZE REVIEW |': '| Relationship domain, version lifecycle and factual semantics | `relationship.md` | FINAL / FROZEN |',
              '| Public HTTP API, projections, failures and pagination | `api.md` | DRAFT — CLOSURE PASSED; READY FOR FREEZE REVIEW |': '| Public HTTP API, projections, failures and pagination | `api.md` | FINAL / FROZEN |',
              '| Persistence authority, relational schema, lifecycle codec, indexes and Alembic realization | `persistence.md` | DRAFT — TRANSACTION/DEADLOCK/CLOSURE PASSED; READY FOR FREEZE REVIEW |': '| Persistence authority, relational schema, lifecycle codec, indexes and Alembic realization | `persistence.md` | FINAL / FROZEN |',
              '| Complete semantic mutation census and pairwise matrix | `concurrency-matrix.md` | DRAFT — MATRIX/REALIZATION/VERIFICATION CLOSURE PASSED; READY FOR FREEZE REVIEW |': '| Complete semantic mutation census and pairwise matrix | `concurrency-matrix.md` | FINAL / FROZEN |',
              '| PostgreSQL lock, gate, retry and deadlock realization | `concurrency.md` | DRAFT — REALIZATION/DEADLOCK/CLOSURE PASSED; READY FOR FREEZE REVIEW |': '| PostgreSQL lock, gate, retry and deadlock realization | `concurrency.md` | FINAL / FROZEN |',
              '| Core Health API | `health.md` | DRAFT — CLOSURE PASSED; READY FOR FREEZE REVIEW |': '| Core Health API | `health.md` | FINAL / FROZEN |',
              '| Official NETAUTO CLI | `cli.md` | DRAFT — CLOSURE PASSED; READY FOR FREEZE REVIEW |': '| Official NETAUTO CLI | `cli.md` | FINAL / FROZEN |',
              '| Runtime configuration, packaging, startup guard, deployment and trust/TLS boundaries | `runtime-deployment.md` | DRAFT — CLOSURE PASSED; READY FOR FREEZE REVIEW |': '| Runtime configuration, packaging, startup guard, deployment and trust/TLS boundaries | `runtime-deployment.md` | FINAL / FROZEN |',
              '| Verification, acceptance evidence and traceability | `verification.md` | DRAFT — CLOSURE PASSED; READY FOR FREEZE REVIEW |': '| Verification, acceptance evidence and traceability | `verification.md` | FINAL / FROZEN |',
          }
          for old, new in table_replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'README expected one table status: {old}')
              text = text.replace(old, new, 1)

          start = text.index('## Remaining work before architecture freeze\n')
          end = text.index('\n## Final closure result\n', start)
          handoff = '''## Post-freeze handoff

The complete M2 architecture set is `FINAL / FROZEN`.

```text
next gated authority
    -> docs/milestones/M2/steps.md

steps.md
    -> NOT STARTED / NOT FROZEN

implementation
    -> NOT AUTHORIZED until steps.md is also FINAL / FROZEN
```

Implementation planning may decompose the work but may not derive a new semantic, technical or technology decision. Any such need requires formal reopening of the owning frozen authority.
'''
          text = text[:start] + handoff + text[end:]
          text = text.replace(
              'The architecture is ready for explicit freeze review. No implementation evidence is claimed or required at this gate.',
              'The architecture freeze was explicitly approved after the traceability, consistency and WIP-extraction closures passed. No implementation evidence is claimed at this gate; executed evidence remains mandatory for implementation slices and final delivery.',
              1,
          )
          freeze_marker = '## Freeze condition\n'
          declaration = '''## Freeze declaration

```text
contract.md                 FINAL / FROZEN
architecture/README.md      FINAL / FROZEN
all architecture owners     FINAL / FROZEN
steps.md                    NOT STARTED / NOT FROZEN
implementation              NOT AUTHORIZED
```

Future semantic or technical changes require formal architecture reopening, impact analysis against the frozen contract and renewed consistency closure.

'''
          if declaration not in text:
              if text.count(freeze_marker) != 1:
                  raise SystemExit('README freeze condition marker not unique')
              text = text.replace(freeze_marker, declaration + freeze_marker, 1)
          readme.write_text(text, encoding='utf-8')

          status = M2 / 'status.md'
          text = status.read_text(encoding='utf-8')
          text = re.sub(r'^\*\*Milestone status:\*\* .+$', '**Milestone status:** IMPLEMENTATION PLANNING', text, count=1, flags=re.MULTILINE)
          text = text.replace('phase           ARCHITECTURE DESIGN', 'phase           IMPLEMENTATION PLANNING', 1)
          text = text.replace('current task    review and approve the dedicated architecture freeze transition', 'current task    define and freeze the complete M2 implementation decomposition in steps.md', 1)
          text = text.replace('| Architecture set | DESIGN COMPLETE — CLOSURE PASSED — READY FOR FREEZE REVIEW — NOT FROZEN |', '| Architecture set | FINAL / FROZEN |', 1)
          text = text.replace(
              'The M2 milestone contract is `FINAL / FROZEN`. Architecture design is authorized against the delivered AS-IS plus the frozen contract. Implementation planning remains blocked until the complete architecture set is frozen, and implementation remains unauthorized.',
              'The M2 milestone contract and complete architecture set are `FINAL / FROZEN`. Implementation planning is now authorized. Implementation remains unauthorized until `steps.md` is also `FINAL / FROZEN`.',
              1,
          )
          text = text.replace(
              'No contract-level, architecture-design, technology or consistency blocker remains. The final closure has passed; explicit approval and the dedicated architecture freeze commit are the only remaining architecture-gate actions.',
              'No contract-level or architecture-level blocker remains. The architecture set is frozen; the only current gate is the complete, traceable implementation decomposition in `steps.md`.',
              1,
          )
          text = text.replace(
              'Review `architecture/README.md` and `wip/architecture-consistency-closure.md`; after explicit approval, execute one dedicated commit that marks the complete architecture set `FINAL / FROZEN` and opens the implementation-planning gate for `steps.md`.',
              'Define every M2 implementation slice, dependency, owning architecture authority, required evidence target and completion condition in `steps.md`; then perform the steps consistency closure and freeze that document before implementation begins.',
              1,
          )
          status.write_text(text, encoding='utf-8')

          if STEPS.read_bytes() != steps_before:
              raise SystemExit('steps.md changed during architecture freeze')
          if '**Status:** NOT STARTED — NOT FROZEN' not in STEPS.read_text(encoding='utf-8'):
              raise SystemExit('steps.md gate changed unexpectedly')

          # Final static freeze assertions.
          for name in owners:
              body = (ARCH / name).read_text(encoding='utf-8')
              if '**Status:** FINAL / FROZEN' not in body.splitlines()[:6]:
                  raise SystemExit(f'{name}: not frozen')
              if 'NORMATIVE M2 ARCHITECTURE — FINAL / FROZEN' not in body.splitlines()[:8]:
                  raise SystemExit(f'{name}: final authority missing')
          readme_body = readme.read_text(encoding='utf-8')
          if '**Architecture set status:** FINAL / FROZEN' not in readme_body:
              raise SystemExit('README not frozen')
          status_body = status.read_text(encoding='utf-8')
          if '| Architecture set | FINAL / FROZEN |' not in status_body:
              raise SystemExit('status architecture gate not frozen')
          if '| Implementation | NOT AUTHORIZED |' not in status_body:
              raise SystemExit('implementation was incorrectly authorized')

          workflow = Path('.github/workflows/audit-and-freeze-m2-architecture.yml')
          workflow.unlink()
          PY

      - name: Commit formal architecture freeze
        shell: bash
        run: |
          set -euo pipefail
          git add -A \
            .github/workflows/audit-and-freeze-m2-architecture.yml \
            docs/milestones/M2/architecture \
            docs/milestones/M2/status.md
          git diff --cached --check
          git diff --exit-code -- docs/milestones/M2/steps.md
          git commit -m 'docs(m2): freeze milestone architecture set'
          git push origin HEAD:M2
