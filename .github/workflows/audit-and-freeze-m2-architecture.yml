review/closure evidence                  PASS — 10 / 10
superseded positions explicitly retired  PASS
technical extraction gaps closed         PASS
implementation dependency on WIP         0
open extraction finding                  0
```

No future implementation slice may cite WIP as its normative owner.

'''
              if readme.count(closure_marker) != 1:
                  raise SystemExit('README final closure marker not unique')
              readme = readme.replace(closure_marker, section + closure_marker, 1)

          readme = readme.replace(
              'normative placeholders                   PASS — 0\n',
              'normative placeholders                   PASS — 0\nWIP extraction / retirement              PASS — 19 / 19\n',
              1,
          )
          freeze_bullet = '- every WIP document has one recorded normative destination, explicit supersession or review-evidence disposition;\n'
          if freeze_bullet not in readme:
              marker = '- cross-document consequences are propagated without duplicated authority;\n'
              if readme.count(marker) != 1:
                  raise SystemExit('README freeze bullet marker not unique')
              readme = readme.replace(marker, freeze_bullet + marker, 1)
          write(readme_path, readme)

          architecture_closure_path = WIP / 'architecture-consistency-closure.md'
          architecture_closure = read(architecture_closure_path)
          if 'WIP extraction / retirement' not in architecture_closure:
              architecture_closure = architecture_closure.replace(
                  'normative TBD / TODO                      PASS — 0\n',
                  'normative TBD / TODO                      PASS — 0\nWIP extraction / retirement               PASS — 19 / 19\n',
                  1,
              )
              marker = '## Freeze recommendation\n'
              section = '''## WIP extraction addendum

A dedicated second-pass audit classified every document in `wip/` and compared its decision-bearing content with the frozen contract, the architecture owners and `STACK-10`.

Four documentation gaps were closed without changing contract behavior:

```text
normative WIP provenance/retirement map
uniform default-pointer defensive read validation
final index replacement/FK-support detail
first-root DDL and shared historical carrier-codec detail
```

Earlier lossless M1→M2 migration/backfill requirements are explicitly superseded, not omitted. The audit result is recorded in `wip-extraction-closure.md`; `architecture/provenance.md` is the normative retirement authority.

```text
classified WIP documents       19 / 19
