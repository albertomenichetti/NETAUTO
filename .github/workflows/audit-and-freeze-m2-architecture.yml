              'runtime': ['runtime.pylock.toml', 'netauto:migrations', 'NETAUTO_SECRETS_DIR', 'CORE_STARTUP_SCHEMA_GUARD_TIMEOUT_SECONDS = 10.0', 'exact equality'],
              'verification': ['M2-VER-01', 'M2-VER-32', '83 canonical scenario registry', 'T10'],
              'provenance': ['classified                        19 / 19', 'implementation dependency on WIP              0', 'Explicit supersession register'],
              'technology': ['STACK-10 — official HTTP CLI and terminal interaction', 'prompt_toolkit', 'HTTPX AsyncClient'],
          }
          missing = []
          for owner, markers in required_markers.items():
              for marker in markers:
                  if marker not in docs[owner]:
