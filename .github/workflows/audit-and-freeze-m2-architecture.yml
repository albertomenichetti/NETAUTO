name: Audit and freeze M2 architecture

on:
  push:
    branches: [M2]
    paths:
      - .github/workflows/audit-and-freeze-m2-architecture.yml

permissions:
  contents: write

jobs:
  audit-and-freeze:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Audit WIP extraction and close documentation gaps
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          ROOT = Path('.')
          M2 = ROOT / 'docs/milestones/M2'
          ARCH = M2 / 'architecture'
          WIP = M2 / 'wip'

          def read(path: Path) -> str:
              return path.read_text(encoding='utf-8')

          def write(path: Path, text: str) -> None:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(text, encoding='utf-8')

          def replace_once(path: Path, old: str, new: str) -> None:
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one occurrence, found {count}: {old[:100]!r}')
              write(path, text.replace(old, new, 1))

          expected_wip = {
              'architecture-consistency-closure.md',
              'cli-architecture-cross-check.md',
              'cli-stack-10-proposal.md',
              'concurrency-matrix-cross-check.md',
              'concurrency-postgresql-cross-check.md',
              'contract-consistency-closure.md',
              'health-api.md',
              'health-architecture-cross-check.md',
              'netauto-cli.md',
              'persistence-transaction-deadlock-cross-check.md',
              'relationship-properties-alembic-baseline.md',
              'relationship-properties-indexes.md',
              'relationship-properties-lifecycle.md',
              'relationship-properties-persistence.md',
              'relationship-properties.md',
              'runtime-configuration-production-deployment.md',
              'runtime-deployment-architecture-cross-check.md',
              'stack-10-ratification-cross-check.md',
              'verification-architecture-cross-check.md',
          }
          actual_wip = {p.name for p in WIP.glob('*.md')}
          if actual_wip != expected_wip:
              raise SystemExit(
                  f'WIP census mismatch: missing={sorted(expected_wip-actual_wip)} '
                  f'extra={sorted(actual_wip-expected_wip)}'
              )

          provenance = '''# M2 WIP Extraction, Provenance and Retirement

**Status:** DRAFT — EXTRACTION / SUPERSESSION AUDIT PASSED — READY FOR FREEZE REVIEW

**Authority:** NORMATIVE M2 ARCHITECTURE DRAFT

## 1. Purpose and authority rule

This document proves that every semantic, decision-bearing or technical item recorded under `../wip/` has one final disposition before the M2 architecture freeze.

After the architecture set is frozen, implementation planning and implementation **must not** use `../wip/` as a requirement or design authority.

The implementation authority remains:

```text
delivered AS-IS in docs/architecture/
+
FINAL / FROZEN docs/milestones/M2/contract.md
+
FINAL / FROZEN docs/milestones/M2/architecture/
+
ratified project-wide decisions in docs/general/technology_baseline.md
```

`../wip/` is retained only as historical discovery and review evidence. When WIP text conflicts with a later frozen decision, the later normative authority wins. A WIP statement absent from the authority composition above is not an implementation requirement.

## 2. Complete WIP disposition map

| WIP file | Classification | Final normative destination | Disposition |
