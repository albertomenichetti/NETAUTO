                  raise SystemExit('README table marker not unique')
              readme = readme.replace(table_marker, table_marker + provenance_row, 1)

          completed_marker = 'verification.md\n    -> T0 ... T10 layers\n'
          if 'provenance.md\n    -> complete 19-document WIP disposition map' not in readme:
              provenance_block = '''provenance.md
    -> complete 19-document WIP disposition map
    -> explicit supersession register
