              write(persistence_path, persistence)

          readme_path = ARCH / 'README.md'
          readme = read(readme_path)
          provenance_row = '| WIP extraction, provenance and retirement | `provenance.md` | DRAFT — EXTRACTION AUDIT PASSED; READY FOR FREEZE REVIEW |\n'
          if provenance_row not in readme:
              table_marker = '| Architecture set control, coverage and freeze | `README.md` | CLOSURE PASSED — READY FOR FREEZE REVIEW |\n'
