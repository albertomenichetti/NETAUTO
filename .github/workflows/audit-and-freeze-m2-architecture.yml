name: Freeze M2 architecture after WIP audit

on:
  push:
    branches: [M2]
    paths:
      - .github/workflows/audit-and-freeze-m2-architecture.yml

permissions:
  contents: write

jobs:
  freeze:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover and validate the formal freeze script
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess

          path = ".github/workflows/audit-and-freeze-m2-architecture.yml"
          source_commit = "c377106cc2b7497d1e8c0cd697fc15be77b641d7"
          source = subprocess.check_output(
              ["git", "show", f"{source_commit}:{path}"], text=True
          )
          marker = "          python - <<'PY'\n"
          parts = source.split(marker)
          if len(parts) != 3:
              raise SystemExit(f"expected two embedded scripts, found {len(parts) - 1}")
          remainder = parts[2]
          if "\n          PY" not in remainder:
              raise SystemExit("freeze script closing marker missing")
          block = remainder.split("\n          PY", 1)[0]
          lines = [
              line[10:] if line.startswith("          ") else line
              for line in block.splitlines()
          ]
          script = "\n".join(lines) + "\n"
          script = script.replace(
              "end = text.index('\\n## Final closure result\\n', start)",
              "end = text.index('\\n## WIP extraction and retirement closure\\n', start)",
          )
          old_assertion = """if 'NORMATIVE M2 ARCHITECTURE — FINAL / FROZEN' not in body.splitlines()[:8]:
              raise SystemExit(f'{name}: final authority missing')"""
          new_assertion = """if not any(
              'NORMATIVE M2 ARCHITECTURE — FINAL / FROZEN' in line
              for line in body.splitlines()[:8]
          ):
              raise SystemExit(f'{name}: final authority missing')"""
          if script.count(old_assertion) != 1:
              raise SystemExit(
                  f"freeze authority assertion not unique: {script.count(old_assertion)}"
              )
          script = script.replace(old_assertion, new_assertion, 1)
          compile(script, "m2-formal-freeze", "exec")
          Path("/tmp/m2-formal-freeze.py").write_text(script, encoding="utf-8")
          PY

      - name: Execute formal architecture freeze
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/m2-formal-freeze.py

      - name: Commit formal architecture freeze
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A \
            .github/workflows/audit-and-freeze-m2-architecture.yml \
            docs/milestones/M2/architecture \
            docs/milestones/M2/status.md
          git diff --cached --check
          git diff --exit-code -- docs/milestones/M2/steps.md
          git commit -m 'docs(m2): freeze milestone architecture set'
          git push origin HEAD:M2
