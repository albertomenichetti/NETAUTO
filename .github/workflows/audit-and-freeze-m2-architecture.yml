          }
          required_markers = {
              'relationship': ['RelationshipDefinitionVersion', 'SCALAR -> LIST', 'relationship_fact_conflict', 'Relationship.DATA_CHANGE', 'Relationship.SCHEMA_CHANGE'],
              'api': ['63 total /api/v1/core operations', 'GET /health/core', 'RELATIONSHIP_SCHEMA_CHANGE', 'relationship_definition_version'],
              'persistence': ['15 authoritative tables', 'MODEL_ROOT_DELETE_GATE', 'ix_relationships_definition_version', 'Uniform defensive validation of default pointers', 'Durable-root DDL realization', 'Shared historical runtime-property carrier codec'],
              'matrix': ['mutation census complete        41 / 41', 'unordered cells classified      861 / 861', 'VH', 'RS'],
              'concurrency': ['MAX_SEMANTIC_UOW_ATTEMPTS = 4', 'MODEL_ROOT_DELETE_GATE', 'FOR NO KEY UPDATE', '40P01'],
              'health': ['SELECT 1', 'CORE_DATABASE_HEALTH_TIMEOUT_SECONDS = 2.0', 'same AsyncEngine'],
