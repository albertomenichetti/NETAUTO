          if {p.name for p in WIP.glob('*.md')} != expected_wip | {'wip-extraction-closure.md'}:
              raise SystemExit('post-audit WIP census mismatch')
          if any(name not in docs['provenance'] for name in expected_wip):
              absent = sorted(name for name in expected_wip if name not in docs['provenance'])
              raise SystemExit(f'provenance missing WIP files: {absent}')
          PY

      - name: Commit WIP extraction closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
