name: Audit and freeze M2 architecture

on:
  push:
    branches: [M2]
    paths:
      - .github/workflows/audit-and-freeze-m2-architecture.yml

permissions:
  contents: write

jobs:
  audit-and-freeze:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover and validate the audit scripts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess

          path = ".github/workflows/audit-and-freeze-m2-architecture.yml"
          source = subprocess.check_output(
              ["git", "show", f"HEAD^:{path}"], text=True
          )
          marker = "          python - <<'PY'\n"
          parts = source.split(marker)
          if len(parts) != 3:
              raise SystemExit(f"expected two embedded scripts, found {len(parts) - 1}")

          for index, remainder in enumerate(parts[1:], start=1):
              if "\n          PY" not in remainder:
                  raise SystemExit(f"stage {index}: closing marker missing")
              block = remainder.split("\n          PY", 1)[0]
              lines = [
                  line[10:] if line.startswith("          ") else line
                  for line in block.splitlines()
              ]
              script = "\n".join(lines) + "\n"
              if index == 2:
                  script = script.replace(
                      "end = text.index('\\n## Final closure result\\n', start)",
                      "end = text.index('\\n## WIP extraction and retirement closure\\n', start)",
                  )
              compile(script, f"m2-audit-stage-{index}", "exec")
              Path(f"/tmp/m2-audit-stage-{index}.py").write_text(
                  script, encoding="utf-8"
              )
          PY

      - name: Execute WIP extraction audit
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/m2-audit-stage-1.py

      - name: Commit WIP extraction closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            docs/milestones/M2/architecture/README.md \
            docs/milestones/M2/architecture/persistence.md \
            docs/milestones/M2/architecture/provenance.md \
            docs/milestones/M2/wip/architecture-consistency-closure.md \
            docs/milestones/M2/wip/wip-extraction-closure.md
          git diff --cached --check
          git commit -m 'docs(m2): close WIP extraction into architecture'
          git push origin HEAD:M2

      - name: Execute formal architecture freeze
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/m2-audit-stage-2.py

      - name: Commit formal architecture freeze
        shell: bash
        run: |
          set -euo pipefail
          git add -A \
            .github/workflows/audit-and-freeze-m2-architecture.yml \
            docs/milestones/M2/architecture \
            docs/milestones/M2/status.md
          git diff --cached --check
          git diff --exit-code -- docs/milestones/M2/steps.md
          git commit -m 'docs(m2): freeze milestone architecture set'
          git push origin HEAD:M2
