          write(WIP / 'wip-extraction-closure.md', '\n'.join(report) + '\n')

          # Semantic/technical marker audit after the extraction additions.
          docs = {
              'relationship': read(ARCH / 'relationship.md'),
              'api': read(ARCH / 'api.md'),
