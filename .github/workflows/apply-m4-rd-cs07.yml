name: Apply M4 RelationshipDefinition CS-07

on:
  push:
    branches:
      - M4
    paths:
      - .github/workflows/apply-m4-rd-cs07.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: M4
          fetch-depth: 0

      - name: Record CS-07 and remove temporary updater files
        shell: bash
        run: |
          set -euo pipefail
          owner="docs/milestones/M4/wip/relationshipdefinition.md"
          ledger="docs/milestones/M4/wip/relationshipdefinition-technical-consolidation.md"

          if ! grep -Fq "# 23. CS-07 — committed property-history linearization — RESOLVED" "$owner"; then
            cat .github/tmp/rd-cs07-owner.md >> "$owner"
          fi

          if ! grep -Fq "## CS-07 — committed property-history linearization — RESOLVED" "$ledger"; then
            python - <<'PY'
          from pathlib import Path

          path = Path("docs/milestones/M4/wip/relationshipdefinition-technical-consolidation.md")
          text = path.read_text(encoding="utf-8")
          section = Path(".github/tmp/rd-cs07-ledger.md").read_text(encoding="utf-8")
          marker = "\n---\n\n# 13. Current technical frontier"
          if marker not in text:
              raise SystemExit("ledger frontier marker not found")
          path.write_text(text.replace(marker, section + marker, 1), encoding="utf-8")
          PY
          fi

          git rm -- .github/workflows/apply-m4-rd-cs07.yml \
                    .github/tmp/rd-cs07-owner.md \
                    .github/tmp/rd-cs07-ledger.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$owner" "$ledger"
          git commit -m "docs(m4): linearize RelationshipDefinition committed property history"
          git push origin HEAD:M4
