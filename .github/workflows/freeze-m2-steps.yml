name: Freeze M2 implementation steps
# retry after validated payload correction

on:
  push:
    branches: [M2]
    paths:
      - .github/workflows/freeze-m2-steps.yml

permissions:
  contents: write

jobs:
  freeze:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize and validate implementation planning
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/milestones/M2/wip
          cat .github/m2-steps-payload/steps-*.b64 \
            | base64 --decode \
            | gzip --decompress \
            > docs/milestones/M2/steps.md
          cat .github/m2-steps-payload/closure.b64 \
            | base64 --decode \
            | gzip --decompress \
            > docs/milestones/M2/wip/steps-consistency-closure.md
          cat .github/m2-steps-payload/status.b64 \
            | base64 --decode \
            | gzip --decompress \
            > docs/milestones/M2/status.md

          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import re

          paths = {
              "steps": Path("docs/milestones/M2/steps.md"),
              "closure": Path("docs/milestones/M2/wip/steps-consistency-closure.md"),
              "status": Path("docs/milestones/M2/status.md"),
          }
          expected_hashes = {
              "steps": "385f242cb566703b8c4ed18982102fc9a4aecf2ea2dbae6b750d59b341d23fcd",
              "closure": "7aeedd47903e2dff6715c4e017ac4609e6a1530a8fe9eb6c708d625401020525",
              "status": "e41b16774bea105d81eb8e7daf7728e07d296dc37ca110ac34753224b40dd785",
          }
          for name, path in paths.items():
              actual = sha256(path.read_bytes()).hexdigest()
              if actual != expected_hashes[name]:
                  raise SystemExit(f"{name} payload hash mismatch: {actual}")

          steps = paths["steps"].read_text(encoding="utf-8")
          closure = paths["closure"].read_text(encoding="utf-8")
          status = paths["status"].read_text(encoding="utf-8")

          expected_slices = [f"M2-S{i:02d}" for i in range(10)]
          actual_slices = re.findall(r"^## (M2-S\d{2})\b", steps, re.MULTILINE)
          if actual_slices != expected_slices:
              raise SystemExit(f"slice census/order mismatch: {actual_slices}")

          if len(re.findall(r"^### Completion condition$", steps, re.MULTILINE)) != 10:
              raise SystemExit("each slice must have one completion condition")

          primary = steps.split(
              "## 5. Primary evidence ownership matrix", 1
          )[1].split("## 6. Outcome-to-slice coverage", 1)[0]
          actual_ver = re.findall(r"M2-VER-(\d{2})", primary)
          expected_ver = [f"{i:02d}" for i in range(1, 33)]
          if sorted(actual_ver) != expected_ver or len(actual_ver) != 32:
              raise SystemExit(f"primary evidence assignment mismatch: {actual_ver}")

          expected_out = {f"M2-OUT-{i:02d}" for i in range(1, 17)}
          outcome_section = steps.split(
              "## 6. Outcome-to-slice coverage", 1
          )[1].split("## 7. Final acceptance gate model", 1)[0]
          actual_out = set(re.findall(r"M2-OUT-\d{2}", outcome_section))
          if actual_out != expected_out:
              raise SystemExit(
                  f"outcome coverage mismatch: missing={expected_out-actual_out} "
                  f"extra={actual_out-expected_out}"
              )

          for name, text in (("steps", steps), ("closure", closure), ("status", status)):
              if re.search(r"\b(?:TBD|TODO)\b", text):
                  raise SystemExit(f"unresolved placeholder in {name}")

          required = (
              "**Status:** FINAL / FROZEN",
              "No slice may use a WIP file as its normative owner.",
              "M2-S09",
              "reviewer approval",
              "MAX_SEMANTIC_UOW_ATTEMPTS = 4",
              "83 / 83 canonical scenarios",
              "63 API / 63 CLI equality",
          )
          missing = [marker for marker in required if marker not in steps]
          if missing:
              raise SystemExit(f"required planning markers missing: {missing}")

          if "**Milestone status:** IMPLEMENTATION — M2-S00 READY" not in status:
              raise SystemExit("status does not initialize M2-S00")
          PY

      - name: Update cycle status and remove bootstrap
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")
          old = "| `M2` | Milestone | DESIGN | [`docs/milestones/M2`](docs/milestones/M2) | M2 |"
          new = "| `M2` | Milestone | IMPLEMENTATION | [`docs/milestones/M2`](docs/milestones/M2) | M2 |"
          if readme.count(old) != 1:
              raise SystemExit("root README M2 cycle row is not the expected value")
          readme_path.write_text(readme.replace(old, new, 1), encoding="utf-8")

          workflow = Path(".github/workflows/freeze-m2-steps.yml")
          payload = Path(".github/m2-steps-payload")
          if not workflow.exists() or not payload.is_dir():
              raise SystemExit("bootstrap material missing during cleanup")
          workflow.unlink()
          for child in payload.iterdir():
              child.unlink()
          payload.rmdir()
          PY

      - name: Commit formal steps freeze
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A \
            .github/m2-steps-payload \
            .github/workflows/freeze-m2-steps.yml \
            README.md \
            docs/milestones/M2/steps.md \
            docs/milestones/M2/status.md \
            docs/milestones/M2/wip/steps-consistency-closure.md
          git diff --cached --check
          git diff --exit-code -- docs/milestones/M2/contract.md
          git diff --exit-code -- docs/milestones/M2/architecture
          git commit -m 'docs(m2): freeze implementation steps and open M2-S00'
          git push origin HEAD:M2
