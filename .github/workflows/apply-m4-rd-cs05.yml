name: Apply M4 RelationshipDefinition CS-05

on:
  push:
    branches:
      - M4
    paths:
      - .github/workflows/apply-m4-rd-cs05.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: M4
      - name: Update RelationshipDefinition owner and temporary ledger
        shell: bash
        env:
          OWNER_SECTION_B64: 
          LEDGER_SECTION_B64: 
        run: |
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          owner_path = Path("docs/milestones/M4/wip/relationshipdefinition.md")
          ledger_path = Path("docs/milestones/M4/wip/relationshipdefinition-technical-consolidation.md")
          owner_section = base64.b64decode(os.environ["OWNER_SECTION_B64"]).decode("utf-8")
          ledger_section = base64.b64decode(os.environ["LEDGER_SECTION_B64"]).decode("utf-8")

          owner = owner_path.read_text(encoding="utf-8")
          owner_heading = "# 21. CS-05 — RDV declaration → exact DataTypeVersion dependency matrix — RESOLVED"
          if owner_heading not in owner:
              owner_path.write_text(owner.rstrip() + owner_section + "\n", encoding="utf-8")

          ledger = ledger_path.read_text(encoding="utf-8")
          ledger_heading = "## CS-05 — RDV declaration → exact DataTypeVersion dependency matrix — RESOLVED"
          if ledger_heading not in ledger:
              marker = "\n---\n\n# 13. Current technical frontier"
              if marker not in ledger:
                  raise SystemExit("ledger frontier marker not found")
              ledger_path.write_text(ledger.replace(marker, ledger_section + marker, 1), encoding="utf-8")
          PY
      - name: Commit documentation changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/milestones/M4/wip/relationshipdefinition.md \
                  docs/milestones/M4/wip/relationshipdefinition-technical-consolidation.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs(m4): record RelationshipDefinition DTV dependency matrix"
          git push origin HEAD:M4
