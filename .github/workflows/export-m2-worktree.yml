name: Export M2 worktree

on:
  push:
    branches: [M2]
    paths:
      - .github/workflows/export-m2-worktree.yml

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build worktree archive
        run: |
          set -euo pipefail
          git archive --format=tar.gz --output=/tmp/NETAUTO-M2.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: NETAUTO-M2-worktree
          path: /tmp/NETAUTO-M2.tar.gz
          if-no-files-found: error
          retention-days: 1
