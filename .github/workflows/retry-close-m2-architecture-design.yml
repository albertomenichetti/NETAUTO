name: Retry M2 architecture design closure

on:
  push:
    branches: [M2]
    paths:
      - .github/workflows/retry-close-m2-architecture-design.yml

permissions:
  contents: write

jobs:
  close:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Execute corrected closure
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/close-m2-architecture-design.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Commit closure review"
          if source.count(start_marker) != 1 or source.count(end_marker) != 1:
              raise SystemExit('unable to identify the canonical closure script')
          embedded = source.split(start_marker, 1)[1].split(end_marker, 1)[0]
          script = textwrap.dedent(embedded)

          old = '''placeholders = []
          for path in normative_files:
              text = read(path)
              for marker in ('TBD', 'TODO'):
                  if re.search(rf'\\b{marker}\\b', text):
                      placeholders.append(f'{path}:{marker}')
          checks['normative placeholders 0'] = not placeholders'''
          old = textwrap.dedent(old)

          new = '''placeholders = []
          heading_placeholder = re.compile(r'^#{1,6}\\s+(?:TBD|TODO)\\s*$', re.IGNORECASE)
          status_placeholder = re.compile(
              r'^\\s*\\*\\*(?:Status|Open [^*]*points?):\\*\\*.*\\b(?:TBD|TODO)\\b',
              re.IGNORECASE,
          )
          assignment_placeholder = re.compile(
              r'^\\s*(?:status|owner|decision|implementation|open [^:=]*points?)\\s*[:=]\\s*(?:TBD|TODO)\\s*$',
              re.IGNORECASE,
          )
          for path in normative_files:
              for line_number, line in enumerate(read(path).splitlines(), start=1):
                  if (
                      heading_placeholder.fullmatch(line)
                      or status_placeholder.search(line)
                      or assignment_placeholder.fullmatch(line)
                  ):
                      placeholders.append(f'{path}:{line_number}:{line.strip()}')
          checks['normative placeholders 0'] = not placeholders'''
          new = textwrap.dedent(new)

          if script.count(old) != 1:
              raise SystemExit('the placeholder matcher in the canonical closure script is not the expected version')
          script = script.replace(old, new, 1)
          Path('/tmp/m2_architecture_closure.py').write_text(script, encoding='utf-8')
          PY
          python /tmp/m2_architecture_closure.py

      - name: Commit closure review
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            docs/milestones/M2/architecture/README.md \
            docs/milestones/M2/architecture/relationship.md \
            docs/milestones/M2/architecture/api.md \
            docs/milestones/M2/architecture/persistence.md \
            docs/milestones/M2/architecture/concurrency-matrix.md \
            docs/milestones/M2/architecture/concurrency.md \
            docs/milestones/M2/architecture/health.md \
            docs/milestones/M2/architecture/cli.md \
            docs/milestones/M2/architecture/runtime-deployment.md \
            docs/milestones/M2/architecture/verification.md \
            docs/milestones/M2/status.md \
            docs/milestones/M2/wip/architecture-consistency-closure.md
          git diff --cached --check
          git commit -m 'docs(m2): close architecture traceability and consistency'
          git push origin HEAD:M2
