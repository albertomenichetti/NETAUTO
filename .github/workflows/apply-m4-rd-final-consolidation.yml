name: Apply M4 RelationshipDefinition final consolidation

on:
  push:
    branches:
      - M4
    paths:
      - .github/workflows/apply-m4-rd-final-consolidation.yml

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: M4
          fetch-depth: 0

      - name: Consolidate RelationshipDefinition reviewed baseline
        shell: bash
        env:
          SCRIPT_GZ_B64: ""
        run: |
          set -euo pipefail
          python -c 'import base64,gzip,os; open("/tmp/apply.py","wb").write(gzip.decompress(base64.b64decode(os.environ["SCRIPT_GZ_B64"])))'
          python /tmp/apply.py

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "docs(m4): consolidate RelationshipDefinition reviewed baseline"
          git push origin HEAD:M4
