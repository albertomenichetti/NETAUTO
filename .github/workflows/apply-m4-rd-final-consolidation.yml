name: Apply M4 RelationshipDefinition final consolidation

on:
  push:
    branches:
      - M4
    paths:
      - .github/workflows/apply-m4-rd-final-consolidation.yml

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: M4
          fetch-depth: 0

      - name: Consolidate RelationshipDefinition reviewed baseline
        shell: bash
        run: |
          set -euo pipefail

          cat .github/tmp/rd-final-*.b64 | base64 -d | gzip -d > /tmp/apply.py
          echo "d7df4bb39bf9cc75a311fa966f19b981651d5583c7e903ab6c624086307bc510  /tmp/apply.py" | sha256sum -c -
          python /tmp/apply.py
          rm -f .github/tmp/rd-final-*.b64

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "docs(m4): consolidate RelationshipDefinition reviewed baseline"
          git push origin HEAD:M4
