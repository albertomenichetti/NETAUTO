name: Apply M4 RelationshipDefinition final consolidation

on:
  push:
    branches:
      - M4
    paths:
      - .github/workflows/apply-m4-rd-final-consolidation.yml

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: M4
          fetch-depth: 0

      - name: Consolidate RelationshipDefinition reviewed baseline
        shell: bash
        run: |
          set -euo pipefail
          git rm -- .github/workflows/apply-m4-rd-final-consolidation.yml

          python - <<'PY'
          from pathlib import Path
          import re

          root = Path(".").resolve()
          wip = root / "docs/milestones/M4/wip"
          owner_path = wip / "relationshipdefinition.md"
          ledger_path = wip / "relationshipdefinition-technical-consolidation.md"
          index_path = wip / "index.md"

          owner = owner_path.read_text(encoding="utf-8")
          ledger = ledger_path.read_text(encoding="utf-8")
          index = index_path.read_text(encoding="utf-8")

          section1 = "# 1. Current capability inventory"
          frontier = "# 18. Current next review frontier"
          tech1 = "# 1. `relationship_definition_space` classification"
          cs = "# 12. Consistency sweep checkpoints"
          ledger_frontier = "# 13. Current technical frontier"

          for marker, text in (
              (section1, owner), (frontier, owner),
              (tech1, ledger), (cs, ledger), (ledger_frontier, ledger),
          ):
              if marker not in text:
                  raise SystemExit(f"missing marker: {marker}")

          preamble = """# M4 WIP — RelationshipDefinition model-plane review owner

          **Status:** REVIEWED BASELINE / SINGLE FAMILY OWNER / REST + TECHNICAL DISCOVERY CONSOLIDATED / ARCHITECTURE CLOSING PENDING / M4 WIP / ALWAYS NON-NORMATIVE

          ## Purpose and ownership

          This document is the single current M4 WIP owner for the complete `RelationshipDefinition` model-plane family. It owns the reviewed public contracts, stable semantic model, exact-version/property authoring rules, logical persistence and ownership, `relationship_definition_space`, route-local data paths, cache boundaries, cost constraints and explicit architecture/concurrency handoffs.

          Everything under `wip/` remains globally non-normative and does not authorize implementation.

          The former semantic-intent draft, operation-specific discovery notes and temporary technical ledger have been absorbed here and removed. Git history remains the historical source for superseded reasoning.

          Cross-domain responsibilities remain owned by `general-domain-principles.md`, `version-allocation.md`, `object-template-ancestry-cache.md` and the factual `relationship.md`. The delivered AS-IS under `docs/architecture/` remains authoritative until M4 freezes and promotes a TO-BE architecture set.

          ---
          """

          contract = owner[owner.index(section1):owner.index(frontier)].rstrip()
          contract = re.sub(r"\n---\s*$", "", contract)
          contract = contract.replace(
              "This REST closure remains M4 WIP and non-normative. It does not mean the RelationshipDefinition family has reached the consolidated discovery baseline of Object/factual Relationship, and it does not freeze physical SQL, cache realization, lock/FK/UNIQUE arbitration, retry behavior, DDL or migration/backfill.",
              "This REST closure remains M4 WIP and non-normative. The consolidated technical baseline below brings the family to `REVIEWED BASELINE`; physical SQL, cache realization, lock/FK/UNIQUE arbitration, retry behavior, DDL and migration/backfill remain open architecture work.",
          )

          def demote(value: str) -> str:
              return re.sub(r"(?m)^(#+)(?=\s)", lambda m: "#" + m.group(1), value)

          technical = ledger[ledger.index(tech1):ledger.index(cs)].strip()
          technical = technical.replace(
              "The older RelationshipDefinition REST/discovery wording that forbids committed-history `LIST -> SCALAR` is **superseded by the current M4 revalidation and must be corrected when this ledger is absorbed into the owner**.",
              "The former wording that forbade committed-history `LIST -> SCALAR` is superseded; this owner carries the corrected rule.",
          )
          consistency = ledger[ledger.index(cs) + len(cs):ledger.index(ledger_frontier)].strip()

          closure = """# 20. Logical-model and reviewed-baseline closure

          The stable logical source of truth is the compact `RelationshipDefinition`: stable identity, explicit symmetry, two stable endpoint roots, the complete stable directional naming contract and mutable `default_version`. A/B preserves caller-authored orientation and is not a privileged source/target ordering. There is no autonomous `RelationshipResolution`, `resolution_id`, mutable semantic-name child or identity-preserving RENAME.

          Exact RDV and property rows own lifecycle/generation and ordered exact DTV declarations. Internal ordinal preserves array order but is not public semantic identity. `relationship_definition_space` is Definition-owned derived certified current model knowledge, not a second domain authority.

          A model cell `(T, name, T)` is valid same-template applicability. It does not authorize factual self-reference; `from_object_id != to_object_id` remains a factual Relationship rule. Final DDL must not turn that Object-identity rule into a model-plane endpoint-template inequality.

          Domain code owns symmetry/name/topology semantics. PostgreSQL owns relational integrity, exact lifetime, owned cleanup and final current-state arbitration. Final SQL names/types, PK/FK/UNIQUE/index choices, lock/wait/retry/deadlock realization, migration/backfill, cache implementation and verification remain architecture work.

          Current result:

          ```text
          one active RelationshipDefinition family owner
          no unresolved REST / semantic / data-path / cache contradiction
          all remaining items explicitly classified as architecture/concurrency/physical handoffs
          implementation still forbidden
          ```

          Material changes to ObjectTemplate inheritance, DataType dependency lifecycle, factual Relationship admission, stable Definition semantics, version allocation or measured semantic-space cost reopen only the affected boundaries.
          """

          owner_path.write_text(
              preamble.rstrip()
              + "\n\n"
              + contract
              + "\n\n---\n\n# 18. Consolidated operation-level technical discovery\n\n"
              + demote(technical)
              + "\n\n---\n\n# 19. Bidirectional consistency sweep\n\n"
              + demote(consistency)
              + "\n\n---\n\n"
              + closure.rstrip()
              + "\n",
              encoding="utf-8",
          )

          match = re.search(r"(## REVIEWED BASELINE\n\n```text\n)(.*?)(\n```)", index, re.S)
          if not match:
              raise SystemExit("index reviewed baseline block missing")
          baseline = match.group(2)
          if "relationshipdefinition.md" not in baseline.splitlines():
              baseline = baseline.rstrip() + "\nrelationshipdefinition.md"
          index = index[:match.start()] + match.group(1) + baseline + match.group(3) + index[match.end():]
          index = index.replace("through `C-REL-35`", "through `C-REL-36`")

          frontier_text = """# 2. Current review frontier

          `relationshipdefinition.md` has reached the same M4 discovery/revalidation baseline as Object and factual Relationship. This is not architecture closure and does not authorize implementation.

          The remaining unconsolidated model-plane families are DataType and ObjectTemplate. Their review order must be selected explicitly; this consolidation does not silently start broader physical/concurrency architecture closure. Lifecycle remains a separate historical/audit family.

          A material future change reopens only the reviewed dependencies it actually affects.

          """
          spine = "# 3. Current M4 spine"
          if "# 2. Current review frontier" not in index or spine not in index:
              raise SystemExit("index frontier markers missing")
          index = index[:index.index("# 2. Current review frontier")] + frontier_text + index[index.index(spine):]

          index = index.replace(
              "These families remain non-normative active input unless/until consolidated and promoted by the milestone architecture process.",
              "DataType and ObjectTemplate remain non-normative active input. RelationshipDefinition is consolidated below as a reviewed family owner.",
              1,
          )

          rd = """## RelationshipDefinition — REVIEWED BASELINE / ARCHITECTURE CLOSING PENDING

          ### [`relationshipdefinition.md`](relationshipdefinition.md) — SPINE / REVIEWED BASELINE / single family owner

          Sole active M4 RelationshipDefinition model-plane owner. It consolidates the four GETs, nine retained mutations, removed RENAME, compact stable Definition semantics, exact RDV/property ownership, shared no-reuse allocation, certified semantic space, route-local data paths/costs, immutable exact-RDV cache, DTV/default/history lifetime rules and explicit architecture handoffs.

          The former intent draft, operation notes and temporary ledger have been absorbed and removed; Git history remains the historical record. Final DDL, locking, cache implementation, migration/backfill, factual CREATE selector and verification remain later work.

          """
          rd_old = "## RelationshipDefinition — ACTIVE REVIEW FRONTIER"
          rel = "# 6. Factual Relationship"
          if rd_old not in index or rel not in index:
              raise SystemExit("index RelationshipDefinition markers missing")
          index = index[:index.index(rd_old)] + rd + index[index.index(rel):]

          anchor = "`REVIEWED BASELINE` remains a WIP review state only."
          if anchor in index and "RelationshipDefinition has completed its REST and technical consistency sweep" not in index:
              index = index.replace(
                  anchor,
                  "RelationshipDefinition has completed its REST and technical consistency sweep in `relationshipdefinition.md`; its subordinate files were absorbed and removed.\n\n" + anchor,
                  1,
              )
          index_path.write_text(index, encoding="utf-8")

          delete_paths = sorted(wip.glob("relationshipdefinition-*-discovery.md"))
          for extra in (ledger_path, wip / "new-relationship-definition.md"):
              if extra.exists():
                  delete_paths.append(extra)
          if len(delete_paths) != 16:
              raise SystemExit(f"expected 16 absorbed files, found {len(delete_paths)}")

          deleted = {p.name for p in delete_paths}
          stale = []
          for path in root.rglob("*"):
              if not path.is_file() or ".git" in path.parts or path in delete_paths:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              for name in deleted:
                  if name in text:
                      stale.append(f"{path.relative_to(root)} -> {name}")
          if stale:
              raise SystemExit("stale references remain:\n" + "\n".join(sorted(stale)))

          for path in delete_paths:
              path.unlink()

          final_owner = owner_path.read_text(encoding="utf-8")
          final_index = index_path.read_text(encoding="utf-8")
          for marker in (
              "REVIEWED BASELINE / SINGLE FAMILY OWNER",
              "# 18. Consolidated operation-level technical discovery",
              "# 19. Bidirectional consistency sweep",
              "# 20. Logical-model and reviewed-baseline closure",
          ):
              if marker not in final_owner:
                  raise SystemExit(f"final owner marker missing: {marker}")
          if "## RelationshipDefinition — REVIEWED BASELINE / ARCHITECTURE CLOSING PENDING" not in final_index:
              raise SystemExit("final index marker missing")
          if list(wip.glob("relationshipdefinition-*")) or (wip / "new-relationship-definition.md").exists():
              raise SystemExit("absorbed files still present")

          print("RelationshipDefinition consolidation validated.")
          for name in sorted(deleted):
              print("deleted", name)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "docs(m4): consolidate RelationshipDefinition reviewed baseline"
          git push origin HEAD:M4
