[project]
name = "netauto"
version = "0.1.0"
description = "REST-API-first dynamic infrastructure modeling framework."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "httpx",
    "jsonschema",
    "pydantic>=2,<3",
    "psycopg[binary]>=3,<4",
    "sqlalchemy>=2,<3",
    "typer",
]

[project.scripts]
netauto = "netauto.cli.app:main"

[dependency-groups]
dev = [
    "httpx2>=2.9.1",
    "pyright[nodejs]",
    "pytest",
    "ruff",
    "uvicorn>=0.52.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/netauto"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
markers = [
    "postgresql: requires a real PostgreSQL instance via TEST_DATABASE_URL",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
