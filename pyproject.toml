[project]
name = "netauto"
version = "0.1.0"
description = "REST-API-first dynamic infrastructure modeling framework."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "httpx",
    "jsonschema",
    "pydantic>=2,<3",
    "sqlalchemy>=2,<3",
    "typer",
]

[dependency-groups]
dev = [
    "pyright[nodejs]",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/netauto"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
